[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "largerlm"
version = "0.1.0"
description = "Local Apple Silicon LLM tooling for models larger than unified memory."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "LargerLM" }]
dependencies = []

[project.scripts]
largerlm = "largerlm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["largerlm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
